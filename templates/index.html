<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <section>
        <h1 class="weather-title">
            <img src="{{ url_for('static', filename='images/symbol.png') }}" alt="weather icon">
            <span>Weather Forecast</span>
        </h1>
    </section>
    <section>
        <form class="row g-3" id="form1">
            <div class="col-6">
                <label for="inputcity" class="visually-hidden ">city name</label>
                <input type="text" class="form-control form-control-lg rounded-2" id="inputcity"
                    placeholder="Enter city name...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary btn-lg mb-3">Search</button>
            </div>
            <div class="col-auto">
                <button type="button" id="locationBtn" class="btn btn-primary btn-lg mb-3">Use My Location</button>
            </div>

        </form>
    </section>

    <section>

        <div class="d-flex justify-content-center">
            <div class="card rounded-2" id="card1">
                <div class="card-body p-4">
                    <div class="row align-items-start" style="padding-left: 20px;">
                        <div class="col pt-4">
                            <h1><i class="fa-solid fa-temperature-half"></i> <span id="temp">--°C</span></h1>

                        </div>
                        <div class="col">
                            <h1><img id="weatherIcon" src="/static/icons/clear.png" width="120" height="100" alt="weather icon"><span id="condition">---</span></h1>
                            
                        </div>
                        <hr>
                        <div class="col">
                            <h4><i class="fa-solid fa-droplet"></i> Humidity: <span id="humidity">--%</span></h4>

                        </div>
                        <hr>
                        <div class="col">
                            <h4><i class="fa-solid fa-wind"></i> Wind: <span id="Wind">-- km/h</span></h4>

                        </div>

                    </div>


                </div>
            </div>
        </div>

    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
